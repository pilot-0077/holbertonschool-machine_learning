name: Time Series Code Check

on:
  push:
    paths:
      - "supervised_learning/time_series/**"
      - ".github/workflows/time-series-check.yml"
  pull_request:
    paths:
      - "supervised_learning/time_series/**"
      - ".github/workflows/time-series-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install style checker
        run: python -m pip install pycodestyle
      - name: Compile Python files
        run: python -m py_compile supervised_learning/time_series/*.py
      - name: Check Python style
        run: pycodestyle supervised_learning/time_series/*.py
